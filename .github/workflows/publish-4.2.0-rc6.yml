name: Publish v4.2.0-rc.6

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/release-candidate-rc6-trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release candidate branch
        uses: actions/checkout@v6
        with:
          ref: feat/vue3-vuetify-migration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate the release candidate
        run: |
          npm run eslint
          npm run prettier-check
          npm run build

      - name: Prepare release candidate assets
        shell: bash
        run: |
          set -euo pipefail
          cp package.firefox.zip pihole-browser-extension-4.2.0-rc.6-unsigned.xpi
          cp package.chrome.zip pihole-browser-extension-4.2.0-rc.6-chrome.zip
          unzip -t pihole-browser-extension-4.2.0-rc.6-unsigned.xpi
          sha256sum \
            pihole-browser-extension-4.2.0-rc.6-unsigned.xpi \
            pihole-browser-extension-4.2.0-rc.6-chrome.zip \
            > SHA256SUMS-4.2.0-rc.6.txt

          cat > RELEASE_NOTES_RC6.md <<'EOF'
          ## PiHole Browser Extension 4.2.0 RC6

          This prerelease replaces RC1 through RC5 and is intended for manual browser testing.

          ### Global Pi-hole control

          - A dedicated switch enables or disables blocking globally on every configured Pi-hole.
          - The global switch is manual and has no timer.

          ### Client-group control

          - Select one client group and keep that selection for all group-scoped actions.
          - A dedicated manual switch pauses or resumes filtering for the selected group.
          - Three independently configurable buttons pause filtering for the selected group for a fixed duration.
          - The Pi-hole group itself and its normal configuration remain enabled.

          ### Domain actions

          - Permanent Whitelist and Blacklist actions apply to every client group on each configured Pi-hole.
          - The three temporary Whitelist buttons apply only to the client group selected above.
          - Temporary Whitelist durations are configured independently from group-pause durations.
          - Temporary rules are restored automatically after expiry and survive background or browser restarts.

          ### Connection settings

          - Pi-hole addresses and passwords are stored only when the explicit Save button is pressed.
          - Add PiHole creates a new unsaved connection tab.

          ### Framework modernization

          - Vue 3.5
          - Vue Router 5
          - Vuetify 4.1
          - TypeScript 6
          - ESLint 10 and Prettier 3

          ### Firefox note

          The XPI is not signed by Mozilla. Load it temporarily through `about:debugging`, or use Firefox Developer Edition with unsigned extensions enabled.
          EOF

      - name: Remove temporary publisher
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          rm -f \
            .github/workflows/publish-4.2.0-rc6.yml \
            .github/release-candidate-rc6-trigger \
            .github/release-candidate-4.2.0-rc.5.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare 4.2.0 release candidate 6'
          git push origin HEAD:feat/vue3-vuetify-migration
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create or update the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v4.2.0-rc.6'
          ASSETS=(
            pihole-browser-extension-4.2.0-rc.6-unsigned.xpi
            pihole-browser-extension-4.2.0-rc.6-chrome.zip
            SHA256SUMS-4.2.0-rc.6.txt
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --target "$TARGET_SHA" \
              --title 'PiHole Browser Extension 4.2.0 RC6' \
              --notes-file RELEASE_NOTES_RC6.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$TARGET_SHA" \
              --title 'PiHole Browser Extension 4.2.0 RC6' \
              --notes-file RELEASE_NOTES_RC6.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Record the published test build
        shell: bash
        run: |
          set -euo pipefail
          XPI_SHA=$(sha256sum pihole-browser-extension-4.2.0-rc.6-unsigned.xpi | cut -d' ' -f1)
          CHROME_SHA=$(sha256sum pihole-browser-extension-4.2.0-rc.6-chrome.zip | cut -d' ' -f1)
          cat > .github/release-candidate-4.2.0-rc.6.json <<EOF
          {
            "tag": "v4.2.0-rc.6",
            "release_url": "https://github.com/HyperCriSiS/pihole-browser-extension/releases/tag/v4.2.0-rc.6",
            "xpi_url": "https://github.com/HyperCriSiS/pihole-browser-extension/releases/download/v4.2.0-rc.6/pihole-browser-extension-4.2.0-rc.6-unsigned.xpi",
            "xpi_sha256": "$XPI_SHA",
            "chrome_url": "https://github.com/HyperCriSiS/pihole-browser-extension/releases/download/v4.2.0-rc.6/pihole-browser-extension-4.2.0-rc.6-chrome.zip",
            "chrome_sha256": "$CHROME_SHA",
            "source_commit": "$SOURCE_SHA",
            "release_commit": "$TARGET_SHA"
          }
          EOF
          git add .github/release-candidate-4.2.0-rc.6.json
          git commit -m 'Record 4.2.0 release candidate 6'
          git push origin HEAD:feat/vue3-vuetify-migration
