name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --loglevel=error

      - name: Run complete project checks
        run: npm run check

      - name: Prepare browser artifacts
        run: npm run package:artifacts

      - name: Read package version
        id: package
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Upload Firefox package
        uses: actions/upload-artifact@v7
        with:
          name: pihole-browser-extension-${{ steps.package.outputs.version }}-firefox-unsigned
          path: artifacts/pihole-browser-extension-${{ steps.package.outputs.version }}-firefox-unsigned.xpi
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Chrome package
        uses: actions/upload-artifact@v7
        with:
          name: pihole-browser-extension-${{ steps.package.outputs.version }}-chrome
          path: artifacts/pihole-browser-extension-${{ steps.package.outputs.version }}-chrome.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload SHA-256 checksums
        uses: actions/upload-artifact@v7
        with:
          name: pihole-browser-extension-${{ steps.package.outputs.version }}-checksums
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
