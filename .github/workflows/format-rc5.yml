name: Format RC5 changes

on:
  push:
    branches:
      - feat/vue3-vuetify-migration
    paths:
      - .github/format-rc5-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: feat/vue3-vuetify-migration

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format changed sources
        run: npm run prettier-format

      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/format-rc5.yml .github/format-rc5-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format the separated control layout'
          git push origin HEAD:feat/vue3-vuetify-migration
