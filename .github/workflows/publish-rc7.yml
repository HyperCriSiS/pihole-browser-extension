name: Publish v4.2.0-rc.7

on:
  push:
    branches:
      - feat/vue3-vuetify-migration
    paths:
      - .github/publish-rc7-trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release candidate branch
        uses: actions/checkout@v6
        with:
          ref: feat/vue3-vuetify-migration

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate the release candidate
        run: |
          npm run eslint
          npm run prettier-check
          npm run build

      - name: Prepare release candidate assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          cp package.firefox.zip pihole-browser-extension-4.2.0-rc.7-unsigned.xpi
          cp package.chrome.zip pihole-browser-extension-4.2.0-rc.7-chrome.zip
          sha256sum \
            pihole-browser-extension-4.2.0-rc.7-unsigned.xpi \
            pihole-browser-extension-4.2.0-rc.7-chrome.zip \
            > pihole-browser-extension-4.2.0-rc.7-sha256.txt
          echo "xpi_sha=$(sha256sum pihole-browser-extension-4.2.0-rc.7-unsigned.xpi | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "chrome_sha=$(sha256sum pihole-browser-extension-4.2.0-rc.7-chrome.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rc7-notes.md <<'EOF'
          ## Test build

          RC7 fixes the popup layout so the permanent Whitelist and Blacklist buttons and all three timed Whitelist buttons are reachable in the add-on popup.

          - The popup now scrolls vertically instead of clipping its lower domain section.
          - Permanent Whitelist and Blacklist rules apply to all client groups.
          - The three timed Whitelist buttons apply only to the client group selected above.
          - The Firefox XPI is unsigned and intended only for temporary/manual testing.
          EOF
          gh release create v4.2.0-rc.7 \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.assets.outputs.source_commit }}" \
            --title "v4.2.0-rc.7" \
            --notes-file /tmp/rc7-notes.md \
            --prerelease \
            pihole-browser-extension-4.2.0-rc.7-unsigned.xpi \
            pihole-browser-extension-4.2.0-rc.7-chrome.zip \
            pihole-browser-extension-4.2.0-rc.7-sha256.txt

      - name: Record the published test build
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/release-candidate-4.2.0-rc.7.json <<EOF
          {
            "tag": "v4.2.0-rc.7",
            "release_url": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v4.2.0-rc.7",
            "xpi_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v4.2.0-rc.7/pihole-browser-extension-4.2.0-rc.7-unsigned.xpi",
            "xpi_sha256": "${{ steps.assets.outputs.xpi_sha }}",
            "chrome_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v4.2.0-rc.7/pihole-browser-extension-4.2.0-rc.7-chrome.zip",
            "chrome_sha256": "${{ steps.assets.outputs.chrome_sha }}",
            "source_commit": "${{ steps.assets.outputs.source_commit }}",
            "scope": "Popup scrolling exposes the permanent Whitelist, permanent Blacklist and all three selected-group timed Whitelist buttons."
          }
          EOF
          rm -f .github/workflows/publish-rc7.yml .github/publish-rc7-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record v4.2.0-rc.7 test build'
          git push origin HEAD:feat/vue3-vuetify-migration
