name: Create v4.2.0-rc.10

on:
  push:
    branches:
      - feat/add-hypercrisis-credits
    paths:
      - .github/workflows/create-rc10.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/create-rc10.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: v4.2.0-rc.10
      TARGET_SHA: 2b81d219a9736605f9f0703f80cc182478e3a5d5
    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run eslint

      - name: Run Prettier check
        run: npm run prettier-check

      - name: Run status tests
        run: npm run test:status

      - name: Build Firefox and Chromium packages
        run: npm run build

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          FIREFOX_ASSET="pihole-browser-extension-4.2.0-rc.10-firefox.xpi"
          CHROMIUM_ASSET="pihole-browser-extension-4.2.0-rc.10-chromium.zip"
          cp package.firefox.zip "$FIREFOX_ASSET"
          cp package.chrome.zip "$CHROMIUM_ASSET"
          unzip -t "$FIREFOX_ASSET"
          unzip -t "$CHROMIUM_ASSET"
          test "$(unzip -p "$FIREFOX_ASSET" manifest.json | jq -r .version)" = "4.2.0"
          test "$(unzip -p "$CHROMIUM_ASSET" manifest.json | jq -r .version)" = "4.2.0"
          sha256sum "$FIREFOX_ASSET" "$CHROMIUM_ASSET" > SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Test-Release v4.2.0-rc.10

          Dieser Release ersetzt RC9 und enthält den aktuellen Stand aus PR #8 und PR #9.

          ### Enthalten
          - modernisierte Vue-3-/Vuetify-4-Oberfläche
          - kompaktes Popup mit globalen und gruppenbezogenen Aktionen
          - gruppenbezogene permanente Whitelist und Blacklist
          - repariertes temporäres Whitelisting als echte exakte Pi-hole-Regel
          - tatsächliches zeitweises Deaktivieren und Wiederaktivieren einer Client-Gruppe
          - Blockstatus der ausgewählten Client-Gruppe im Popup
          - konfigurierbare Abhängigkeit des Icon-Status von der ausgewählten Gruppe
          - zusätzliche Optionen zum Ausblenden der Gruppenauswahl und Gruppenaktionen
          - Credits für HyperCriSiS; der Spendenlink bleibt unverändert

          ### Testschwerpunkte
          - globale und gruppenbezogene Whitelist-/Blacklist-Aktionen
          - alle drei Zeitwerte für temporäres Whitelisting
          - manuelles und zeitgesteuertes Ausschalten einer Client-Gruppe
          - Wiederherstellung nach Ablauf sowie nach Browser-Neustart
          - Blockstatus im Popup und Badge-Verhalten im Icon
          - identisches Verhalten in Firefox und Chromium

          ### Dateien
          - `pihole-browser-extension-4.2.0-rc.10-firefox.xpi`: unsigned Firefox-Testpaket
          - `pihole-browser-extension-4.2.0-rc.10-chromium.zip`: Chromium-Testpaket
          - `SHA256SUMS.txt`: SHA-256-Prüfsummen

          Zielcommit: `2b81d219a9736605f9f0703f80cc182478e3a5d5`
          EOF

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            pihole-browser-extension-4.2.0-rc.10-firefox.xpi \
            pihole-browser-extension-4.2.0-rc.10-chromium.zip \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Pi-hole Browser Extension v4.2.0-rc.10" \
            --notes-file release-notes.md \
            --prerelease
