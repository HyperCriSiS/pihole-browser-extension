name: Finalize popup redesign PR

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/vue3-vuetify-migration
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false
      - name: Apply remaining source updates
        run: python .github/scripts/finalize_popup_redesign.py
      - run: npm ci --no-audit --no-fund
      - name: Format and validate
        run: |
          npm run prettier-format
          npm run test:domain-status
          npm run eslint
          npm run prettier-check
          npm run build
      - name: Remove temporary helpers
        run: |
          rm -f \
            .github/scripts/finalize_popup_redesign.py \
            .github/workflows/finalize-popup-redesign-pr.yml \
            .github/workflows/finalize-popup-redesign.yml \
            .github/finalize-popup-redesign-trigger \
            .github/workflows/patch-domain-status-api.yml \
            .github/domain-status-api-trigger
      - name: Commit validated redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign popup and add blocked-domain badges'
          git push origin HEAD:feat/vue3-vuetify-migration
