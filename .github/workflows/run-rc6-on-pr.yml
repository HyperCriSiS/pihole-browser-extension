name: Run RC6 domain scope on PR

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/rc6-pr-trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: feat/vue3-vuetify-migration

      - name: Execute prepared migration script
        id: migration
        continue-on-error: true
        shell: python
        run: |
          from pathlib import Path
          import traceback

          try:
              workflow = Path('.github/workflows/apply-rc6-domain-scope.yml').read_text(
                  encoding='utf-8'
              )
              start_marker = '      - name: Apply group-scoped domain changes\n        shell: python\n        run: |\n'
              end_marker = '\n      - name: Set up Node.js\n'
              start = workflow.index(start_marker) + len(start_marker)
              end = workflow.index(end_marker, start)
              script_lines = workflow[start:end].splitlines()
              script = '\n'.join(
                  line[10:] if line.startswith('          ') else line
                  for line in script_lines
              )

              old_fragment = '\n'.join([
                  "if api_text.count(old_add_block) != 1:",
                  "    raise RuntimeError('Could not find permanent domain add block')",
                  "api_text = api_text.replace(old_add_block, new_add_block, 1)",
              ])
              new_fragment = '\n'.join([
                  "add_pattern = re.compile(",
                  "    r\"        if \\(mode === ApiListMode\\.add\\) \\{.*?          return\\n        \\}\\n\\n        try \\{\",",
                  "    re.S,",
                  ")",
                  "api_text, add_count = add_pattern.subn(",
                  "    new_add_block + '\\n        try {',",
                  "    api_text,",
                  "    count=1,",
                  ")",
                  "if add_count != 1:",
                  "    raise RuntimeError('Could not find permanent domain add block')",
              ])
              if old_fragment not in script:
                  raise RuntimeError('Could not patch the prepared domain migration')
              script = script.replace(old_fragment, new_fragment, 1)
              exec(compile(script, 'apply-rc6-domain-scope.py', 'exec'))
          except Exception:
              Path('.github/rc6-migration-error.txt').write_text(
                  traceback.format_exc(),
                  encoding='utf-8',
              )
              raise

      - name: Commit migration diagnostics
        if: steps.migration.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rc6-migration-error.txt
          git commit -m 'Record RC6 migration diagnostics'
          git push origin HEAD:feat/vue3-vuetify-migration
          exit 1

      - name: Set up Node.js
        if: steps.migration.outcome == 'success'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        if: steps.migration.outcome == 'success'
        run: npm ci --no-audit --no-fund

      - name: Format and validate
        if: steps.migration.outcome == 'success'
        run: |
          npm run prettier-format
          npm run eslint
          npm run prettier-check
          npm run build

      - name: Commit validated changes
        if: steps.migration.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-rc6-domain-scope.yml \
            .github/apply-rc6-domain-scope-trigger \
            .github/workflows/run-rc6-on-pr.yml \
            .github/rc6-pr-trigger \
            .github/rc6-migration-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Scope temporary domain whitelisting to the selected group'
          git push origin HEAD:feat/vue3-vuetify-migration
