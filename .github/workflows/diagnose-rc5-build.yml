name: Diagnose RC5 build

on:
  push:
    branches:
      - feat/vue3-vuetify-migration
    paths:
      - .github/diagnose-rc5-build-trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: feat/vue3-vuetify-migration

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture build output
        shell: bash
        run: npm run build > .github/rc5-build-output.txt 2>&1 || true

      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-rc5-build.yml .github/diagnose-rc5-build-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record RC5 build diagnostics'
          git push origin HEAD:feat/vue3-vuetify-migration
