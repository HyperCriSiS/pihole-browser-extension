name: Publish v4.2.0-rc.1

on:
  push:
    branches:
      - feat/vue3-vuetify-migration
    paths:
      - .github/release-candidate-trigger
  pull_request:
    branches:
      - master
    paths:
      - .github/release-candidate-trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release candidate branch
        uses: actions/checkout@v6
        with:
          ref: feat/vue3-vuetify-migration

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Update the package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate the release candidate
        run: |
          npm run eslint
          npm run prettier-check
          npm run build

      - name: Prepare release candidate assets
        shell: bash
        run: |
          set -euo pipefail
          cp package.firefox.zip pihole-browser-extension-4.2.0-rc.1-unsigned.xpi
          cp package.chrome.zip pihole-browser-extension-4.2.0-rc.1-chrome.zip
          unzip -t pihole-browser-extension-4.2.0-rc.1-unsigned.xpi
          sha256sum \
            pihole-browser-extension-4.2.0-rc.1-unsigned.xpi \
            pihole-browser-extension-4.2.0-rc.1-chrome.zip \
            > SHA256SUMS-4.2.0-rc.1.txt

          cat > RELEASE_NOTES_RC1.md <<'EOF'
          ## PiHole Browser Extension 4.2.0 RC1

          This prerelease is intended for manual migration testing and is not the current stable release.

          ### Framework modernization

          - Migrate from Vue 2.7 to Vue 3.5
          - Migrate from Vuetify 2 to Vuetify 4
          - Migrate the options router to the current Vue Router API
          - Update Vue compiler and loader integration
          - Migrate removed Vuetify 2 component structures and props

          ### Toolchain modernization

          - TypeScript 6
          - ESLint 10 with flat config
          - Prettier 3
          - Current browser API definitions and compatible Webpack tooling

          ### Manual test focus

          - Popup rendering and Pi-hole status switch
          - Permanent and temporary domain actions
          - Temporary client-group disable action
          - Options navigation, connection settings and general settings
          - Light and dark system themes

          ### Firefox note

          The XPI is not signed by Mozilla. Load it temporarily through `about:debugging`, or use Firefox Developer Edition with unsigned extensions enabled.
          EOF

      - name: Commit the reproducible release-candidate source
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/publish-4.2.0-rc1.yml \
            .github/release-candidate-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A package-lock.json \
            .github/workflows/publish-4.2.0-rc1.yml \
            .github/release-candidate-trigger
          git commit -m 'Prepare 4.2.0 release candidate 1'
          git push origin HEAD:feat/vue3-vuetify-migration
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create or update the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v4.2.0-rc.1'
          ASSETS=(
            pihole-browser-extension-4.2.0-rc.1-unsigned.xpi
            pihole-browser-extension-4.2.0-rc.1-chrome.zip
            SHA256SUMS-4.2.0-rc.1.txt
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --target "$TARGET_SHA" \
              --title 'PiHole Browser Extension 4.2.0 RC1' \
              --notes-file RELEASE_NOTES_RC1.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$TARGET_SHA" \
              --title 'PiHole Browser Extension 4.2.0 RC1' \
              --notes-file RELEASE_NOTES_RC1.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Record the published test build
        shell: bash
        run: |
          set -euo pipefail
          XPI_SHA=$(sha256sum pihole-browser-extension-4.2.0-rc.1-unsigned.xpi | cut -d' ' -f1)
          CHROME_SHA=$(sha256sum pihole-browser-extension-4.2.0-rc.1-chrome.zip | cut -d' ' -f1)
          cat > .github/release-candidate-4.2.0-rc.1.json <<EOF
          {
            "tag": "v4.2.0-rc.1",
            "release_url": "https://github.com/HyperCriSiS/pihole-browser-extension/releases/tag/v4.2.0-rc.1",
            "xpi_url": "https://github.com/HyperCriSiS/pihole-browser-extension/releases/download/v4.2.0-rc.1/pihole-browser-extension-4.2.0-rc.1-unsigned.xpi",
            "xpi_sha256": "$XPI_SHA",
            "chrome_url": "https://github.com/HyperCriSiS/pihole-browser-extension/releases/download/v4.2.0-rc.1/pihole-browser-extension-4.2.0-rc.1-chrome.zip",
            "chrome_sha256": "$CHROME_SHA",
            "source_commit": "$TARGET_SHA"
          }
          EOF
          git add .github/release-candidate-4.2.0-rc.1.json
          git commit -m 'Record 4.2.0 release candidate 1'
          git push origin HEAD:feat/vue3-vuetify-migration
