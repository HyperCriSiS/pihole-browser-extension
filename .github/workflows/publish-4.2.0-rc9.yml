name: Publish v4.2.0-rc.9

on:
  push:
    branches:
      - feat/vue3-vuetify-migration
    paths:
      - .github/release-candidate-rc9-trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release candidate branch
        uses: actions/checkout@v6
        with:
          ref: feat/vue3-vuetify-migration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate release candidate
        run: |
          npm run test:status
          npm run eslint
          npm run prettier-check
          npm run build

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          cp package.firefox.zip pihole-browser-extension-4.2.0-rc.9-unsigned.xpi
          cp package.chrome.zip pihole-browser-extension-4.2.0-rc.9-chrome.zip
          unzip -t pihole-browser-extension-4.2.0-rc.9-unsigned.xpi
          sha256sum \
            pihole-browser-extension-4.2.0-rc.9-unsigned.xpi \
            pihole-browser-extension-4.2.0-rc.9-chrome.zip \
            > SHA256SUMS-4.2.0-rc.9.txt

          cat > RELEASE_NOTES_RC9.md <<'EOF'
          ## PiHole Browser Extension 4.2.0 RC9

          This prerelease replaces RC1 through RC8 and is intended for manual browser testing.

          ### Shared client-group selection

          - Move the client-group selector directly below the permanent Whitelist and Blacklist buttons.
          - Remove the redundant selected-client-group text.
          - Use the same selected group for temporary domain Whitelisting and group pause actions.
          - Add a default client-group selector to the settings page.
          - Add an option directly below it to hide the selector in the popup while retaining the stored group.

          ### Extension icon badge

          - Restore the global Pi-hole status badge as `On`, `Off` or `Err`.
          - Show a red tab-specific `On!` badge when the active domain is blocked.
          - Restore the normal global status when the domain is allowed or the tab has no valid HTTP/HTTPS domain.
          - Keep Chromium Manifest V3 `action` and Firefox Manifest V2 `browserAction` compatibility.

          ### Existing functionality retained

          - Compact popup layout and domain status display.
          - Permanent Whitelist and Blacklist actions.
          - Three temporary Whitelist presets.
          - Manual and timed group pause controls.
          - Explicit connection Save action.

          ### Firefox note

          The XPI is not signed by Mozilla. Load it temporarily through `about:debugging`, or use Firefox Developer Edition with unsigned extensions enabled.
          EOF

      - name: Remove temporary publisher
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          rm -f \
            .github/workflows/publish-4.2.0-rc9.yml \
            .github/release-candidate-rc9-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare 4.2.0 release candidate 9'
          git push origin HEAD:feat/vue3-vuetify-migration
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v4.2.0-rc.9'
          ASSETS=(
            pihole-browser-extension-4.2.0-rc.9-unsigned.xpi
            pihole-browser-extension-4.2.0-rc.9-chrome.zip
            SHA256SUMS-4.2.0-rc.9.txt
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --target "$TARGET_SHA" \
              --title 'PiHole Browser Extension 4.2.0 RC9' \
              --notes-file RELEASE_NOTES_RC9.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$TARGET_SHA" \
              --title 'PiHole Browser Extension 4.2.0 RC9' \
              --notes-file RELEASE_NOTES_RC9.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Record published build
        shell: bash
        run: |
          set -euo pipefail
          XPI_SHA=$(sha256sum pihole-browser-extension-4.2.0-rc.9-unsigned.xpi | cut -d' ' -f1)
          CHROME_SHA=$(sha256sum pihole-browser-extension-4.2.0-rc.9-chrome.zip | cut -d' ' -f1)
          cat > .github/release-candidate-4.2.0-rc.9.json <<EOF
          {
            "tag": "v4.2.0-rc.9",
            "release_url": "https://github.com/HyperCriSiS/pihole-browser-extension/releases/tag/v4.2.0-rc.9",
            "xpi_url": "https://github.com/HyperCriSiS/pihole-browser-extension/releases/download/v4.2.0-rc.9/pihole-browser-extension-4.2.0-rc.9-unsigned.xpi",
            "xpi_sha256": "$XPI_SHA",
            "chrome_url": "https://github.com/HyperCriSiS/pihole-browser-extension/releases/download/v4.2.0-rc.9/pihole-browser-extension-4.2.0-rc.9-chrome.zip",
            "chrome_sha256": "$CHROME_SHA",
            "source_commit": "$SOURCE_SHA",
            "release_commit": "$TARGET_SHA"
          }
          EOF
          git add .github/release-candidate-4.2.0-rc.9.json
          git commit -m 'Record 4.2.0 release candidate 9'
          git push origin HEAD:feat/vue3-vuetify-migration
