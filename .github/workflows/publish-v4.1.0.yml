name: Publish v4.1.0

on:
  push:
    branches:
      - release/v4.1.0-builder
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'release/v4.1.0-builder')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out released source
        uses: actions/checkout@v6
        with:
          ref: ecf77bc9bbc106a051f8122abd3e6eff405288e8
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Firefox and Chrome packages
        run: npm run build

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          cp package.firefox.zip pihole-browser-extension-4.1.0-unsigned.xpi
          cp package.chrome.zip pihole-browser-extension-4.1.0-chrome.zip
          unzip -t pihole-browser-extension-4.1.0-unsigned.xpi
          sha256sum \
            pihole-browser-extension-4.1.0-unsigned.xpi \
            pihole-browser-extension-4.1.0-chrome.zip \
            > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<'EOF'
          ## PiHole Browser Extension 4.1.0

          ### Neu

          - Drei frei konfigurierbare Zeitvorgaben für temporäre Aktionen
          - Aktuelle Domain für eine ausgewählte Dauer zulassen
          - Pi-hole-v6-Client-Gruppe für eine ausgewählte Dauer deaktivieren
          - Persistente Wiederherstellung über Browser-Alarme
          - Schutz vor dem Überschreiben zwischenzeitlicher manueller Änderungen
          - Wiederholungsversuche, wenn Pi-hole beim Ablauf nicht erreichbar ist

          ### Wartung

          - CI auf Node.js 22 und aktuelle GitHub Actions umgestellt
          - CodeQL auf v4 aktualisiert
          - Chrome- und Firefox-Produktionsbuild geprüft

          ### Hinweis zur Firefox-XPI

          Die bereitgestellte XPI ist nicht von Mozilla signiert. Sie kann über `about:debugging` temporär geladen werden. Für eine dauerhafte Installation in Firefox Stable muss sie über Mozilla Add-ons signiert werden.
          EOF

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v4.1.0'
          ASSETS=(
            pihole-browser-extension-4.1.0-unsigned.xpi
            pihole-browser-extension-4.1.0-chrome.zip
            SHA256SUMS.txt
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title 'PiHole Browser Extension 4.1.0' \
              --notes-file RELEASE_NOTES.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target ecf77bc9bbc106a051f8122abd3e6eff405288e8 \
              --title 'PiHole Browser Extension 4.1.0' \
              --notes-file RELEASE_NOTES.md \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Record successful release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          XPI_SHA=$(sha256sum pihole-browser-extension-4.1.0-unsigned.xpi | cut -d' ' -f1)
          CHROME_SHA=$(sha256sum pihole-browser-extension-4.1.0-chrome.zip | cut -d' ' -f1)
          cat > release-status.json <<EOF
          {
            "tag": "v4.1.0",
            "release_url": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v4.1.0",
            "xpi_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v4.1.0/pihole-browser-extension-4.1.0-unsigned.xpi",
            "xpi_sha256": "${XPI_SHA}",
            "chrome_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v4.1.0/pihole-browser-extension-4.1.0-chrome.zip",
            "chrome_sha256": "${CHROME_SHA}",
            "source_commit": "ecf77bc9bbc106a051f8122abd3e6eff405288e8"
          }
          EOF

          CONTENT=$(base64 -w0 release-status.json)
          STATUS_PATH='.release-status-v4.1.0.json'
          EXISTING_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}?ref=release/v4.1.0-builder" --jq .sha 2>/dev/null || true)

          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" \
              -f message='Record successful v4.1.0 release' \
              -f content="$CONTENT" \
              -f branch='release/v4.1.0-builder' \
              -f sha="$EXISTING_SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" \
              -f message='Record successful v4.1.0 release' \
              -f content="$CONTENT" \
              -f branch='release/v4.1.0-builder'
          fi
