name: Required check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: required-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run eslint

      - name: Run Prettier check
        run: npm run prettier-check

      - name: Run status tests
        run: npm run test:status

      - name: Build Chrome and Firefox packages
        run: npm run build
