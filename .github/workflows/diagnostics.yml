name: Diagnostics

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          npm run eslint -- --format compact > eslint.log 2>&1
          echo "$?" > eslint.exit
          npm run build > build.log 2>&1
          echo "$?" > build.exit
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics
          path: |
            eslint.log
            eslint.exit
            build.log
            build.exit
          retention-days: 1

      - name: Enforce results
        shell: bash
        run: |
          test "$(cat eslint.exit)" = "0"
          test "$(cat build.exit)" = "0"
