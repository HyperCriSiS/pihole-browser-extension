name: Inventory Vue migration

on:
  push:
    branches:
      - feat/vue3-vuetify-migration

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: feat/vue3-vuetify-migration

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Record migration inventory
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Package versions'
            for package in vue vuetify vue-router vue-debounce vue-loader @vue/compiler-sfc; do
              printf '%s: ' "$package"
              npm view "$package" version
            done
            echo
            echo '# Vue files'
            find src -type f -name '*.vue' | sort
            echo
            echo '# Vue and router bootstrap references'
            grep -R -n -E "new Vue|Vue\.use|new VueRouter|createApp|createRouter" src || true
            echo
            echo '# Vuetify tags'
            grep -R -h -o -E '<v-[a-z0-9-]+' src --include='*.vue' | sort | uniq -c | sort -k2
            echo
            echo '# Vuetify directives and removed props'
            grep -R -n -E 'v-slot:|slot=|\.sync| outlined| dense| small| x-small| text| icon| depressed| flat| tile| no-gutters| hide-details| background-color| active-class' src --include='*.vue' || true
          } > .github/vue-migration-inventory.txt

      - name: Commit inventory
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/vue-migration-inventory.txt
          git commit -m 'Record Vue migration inventory'
          git push origin HEAD:feat/vue3-vuetify-migration
