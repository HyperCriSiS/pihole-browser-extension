name: Apply RC6 domain scope

on:
  push:
    branches:
      - feat/vue3-vuetify-migration
    paths:
      - .github/apply-rc6-domain-scope-trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: feat/vue3-vuetify-migration

      - name: Apply group-scoped domain changes
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected one source fragment in {path}, found {text.count(old)}')
              file_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Share the selected group with the domain card.
          status_path = 'src/module/popup/vue/components/PopupStatusCardComponent.vue'
          replace_once(
              status_path,
              "  emits: ['update:modelValue'],",
              "  emits: ['update:modelValue', 'selected-group-change'],",
          )
          replace_once(
              status_path,
              "    watch(selectedGroup, async (groupName) => {\n      if (!groupName) {",
              "    watch(selectedGroup, async (groupName) => {\n      emit('selected-group-change', groupName)\n      if (!groupName) {",
          )

          # Make permanent domain list actions apply to every group on each Pi-hole.
          api_path = Path('src/service/PiHoleApiService.ts')
          api_text = api_path.read_text(encoding='utf-8')
          common_groups_pattern = re.compile(
              r"  public static async getCommonGroups\(\): Promise<PiHoleGroup\[]> \{.*?\n  \}\n\n  public static async getGroup\(",
              re.S,
          )
          common_groups_replacement = """  public static async getGroups(
    piHole: PiHoleSettingsStorage,
  ): Promise<PiHoleGroup[]> {
    this.assertValidPiHole(piHole)
    const response = await this.getAxiosInstance(
      piHole.pi_uri_base!,
      piHole.api_key,
    ).get<PiHoleGroups>('/groups')
    return response.data.groups
  }

  public static async getCommonGroups(): Promise<PiHoleGroup[]> {
    const piHoles = await this.getConfiguredPiHoles()
    const groupSets = await Promise.all(
      piHoles.map((piHole) => this.getGroups(piHole)),
    )

    const firstGroups = groupSets[0]
    if (groupSets.length === 1) {
      return firstGroups
    }

    const remainingGroupNames = groupSets
      .slice(1)
      .map((groups) => new Set(groups.map((group) => group.name)))

    return firstGroups.filter((group) =>
      remainingGroupNames.every((names) => names.has(group.name)),
    )
  }

  public static async getGroup("""
          api_text, count = common_groups_pattern.subn(common_groups_replacement, api_text, count=1)
          if count != 1:
              raise RuntimeError('Could not replace getCommonGroups implementation')

          old_add_block = """        if (mode === ApiListMode.add) {
          const current = await this.getExactDomain(piHole, list, domain)
          if (!current) {
            await this.addExactDomain(piHole, list, domain, {
              comment: 'From PiHole Extension',
              groups: [0],
              enabled: true,
            })
            return
          }

          if (!current.enabled || !current.groups.includes(0)) {
            await this.replaceExactDomain(piHole, list, domain, {
              comment: current.comment,
              groups: Array.from(new Set([...current.groups, 0])),
              enabled: true,
            })
          }
          return
        }
"""
          new_add_block = """        if (mode === ApiListMode.add) {
          const current = await this.getExactDomain(piHole, list, domain)
          const groupIds = (await this.getGroups(piHole)).map(
            (group) => group.id,
          )
          if (groupIds.length < 1) {
            throw new Error('Pi-hole did not return any client groups')
          }

          if (!current) {
            await this.addExactDomain(piHole, list, domain, {
              comment: 'From PiHole Extension',
              groups: groupIds,
              enabled: true,
            })
            return
          }

          const hasExactlyAllGroups =
            current.groups.length === groupIds.length &&
            groupIds.every((groupId) => current.groups.includes(groupId))
          if (!current.enabled || !hasExactlyAllGroups) {
            await this.replaceExactDomain(piHole, list, domain, {
              comment: current.comment,
              groups: groupIds,
              enabled: true,
            })
          }
          return
        }
"""
          if api_text.count(old_add_block) != 1:
              raise RuntimeError('Could not find permanent domain add block')
          api_text = api_text.replace(old_add_block, new_add_block, 1)
          api_path.write_text(api_text, encoding='utf-8')

          # Add a unique group-scoped regex allow rule for each temporary action.
          temp_path = Path('src/service/TemporaryActionService.ts')
          temp_text = temp_path.read_text(encoding='utf-8')
          temp_text = temp_text.replace(
              "const TEMPORARY_ALLOW_COMMENT = 'Temporary allow by PiHole Browser Extension'",
              "const TEMPORARY_ALLOW_COMMENT = 'Temporary allow by PiHole Browser Extension'\nconst TEMPORARY_GROUP_ALLOW_COMMENT =\n  'Temporary group allow by PiHole Browser Extension'",
              1,
          )
          temp_text = temp_text.replace(
              "type TemporaryDomainAction = {\n  domain: string\n  expiresAt: number",
              "type TemporaryDomainAction = {\n  domain: string\n  ruleDomain?: string\n  kind?: 'exact' | 'regex'\n  expiresAt: number",
              1,
          )

          group_method = """
  public static async temporarilyAllowDomainForGroup(
    domain: string,
    groupName: string,
    durationSeconds: number,
  ): Promise<boolean> {
    this.assertDuration(durationSeconds)
    if (!domain) {
      throw new Error("Domain can't be empty")
    }
    if (!groupName) {
      throw new Error('Group name cannot be empty')
    }

    const key = this.createGroupDomainActionKey(domain, groupName)
    let storage = await this.getStorage()
    const existingAction = storage.domains[key]

    if (existingAction && existingAction.expiresAt > Date.now()) {
      existingAction.expiresAt = Date.now() + durationSeconds * 1000
      await this.saveStorage(storage)
      await this.createAlarm(
        `${DOMAIN_ALARM_PREFIX}${key}`,
        existingAction.expiresAt,
      )
      return true
    }

    if (existingAction) {
      await this.restoreDomainAction(key)
      storage = await this.getStorage()
    }

    const ruleDomain = this.createScopedDomainPattern(domain, groupName)
    const action: TemporaryDomainAction = {
      domain,
      ruleDomain,
      kind: 'regex',
      expiresAt: Date.now() + durationSeconds * 1000,
      targets: [],
    }

    try {
      const piHoles = await PiHoleApiService.getConfiguredPiHoles()
      for (const piHole of piHoles) {
        const group = await PiHoleApiService.getGroup(piHole, groupName)
        if (!group) {
          throw new Error(`Group ${groupName} is missing on one Pi-hole`)
        }

        const current = await PiHoleApiService.getRegexDomain(
          piHole,
          ApiList.whitelist,
          ruleDomain,
        )
        if (current && current.comment !== TEMPORARY_GROUP_ALLOW_COMMENT) {
          throw new Error(
            `The reserved temporary allow rule for ${groupName} already exists`,
          )
        }

        const payload = {
          comment: TEMPORARY_GROUP_ALLOW_COMMENT,
          groups: [group.id],
          enabled: true,
        }
        const expected = current
          ? await PiHoleApiService.replaceRegexDomain(
              piHole,
              ApiList.whitelist,
              ruleDomain,
              payload,
            )
          : await PiHoleApiService.addRegexDomain(
              piHole,
              ApiList.whitelist,
              ruleDomain,
              payload,
            )

        action.targets.push({
          pi_uri_base: piHole.pi_uri_base!,
          original: null,
          expected: this.cloneDomain(expected),
        })
        storage.domains[key] = action
        await this.saveStorage(storage)
      }

      if (action.targets.length < 1) {
        return false
      }

      storage.domains[key] = action
      await this.saveStorage(storage)
      await this.createAlarm(`${DOMAIN_ALARM_PREFIX}${key}`, action.expiresAt)
      return true
    } catch (reason) {
      const failedTargets = await this.restoreDomainTargets(action)
      storage = await this.getStorage()

      if (failedTargets.length > 0) {
        action.targets = failedTargets
        action.expiresAt = Date.now() + RESTORE_RETRY_DELAY
        storage.domains[key] = action
        await this.saveStorage(storage)
        await this.createAlarm(`${DOMAIN_ALARM_PREFIX}${key}`, action.expiresAt)
      } else {
        delete storage.domains[key]
        await this.saveStorage(storage)
      }

      throw reason
    }
  }

"""
          marker = "  public static async temporarilyDisableGroup("
          if temp_text.count(marker) != 1:
              raise RuntimeError('Could not find temporary group method marker')
          temp_text = temp_text.replace(marker, group_method + marker, 1)

          old_restore = """        const current = await PiHoleApiService.getExactDomain(
          piHole,
          ApiList.whitelist,
          action.domain,
        )

        // A user changed or removed the entry while the timer was running.
        // In that case their newer state wins and we do not overwrite it.
        if (!current || !this.domainsEqual(current, target.expected)) {
          continue
        }

        if (target.original) {
          await PiHoleApiService.replaceExactDomain(
            piHole,
            ApiList.whitelist,
            action.domain,
            {
              comment: target.original.comment,
              groups: target.original.groups,
              enabled: target.original.enabled,
            },
          )
        } else {
          await PiHoleApiService.deleteExactDomain(
            piHole,
            ApiList.whitelist,
            action.domain,
          )
        }
"""
          new_restore = """        const ruleDomain = action.ruleDomain ?? action.domain
        const isRegex = action.kind === 'regex'
        const current = isRegex
          ? await PiHoleApiService.getRegexDomain(
              piHole,
              ApiList.whitelist,
              ruleDomain,
            )
          : await PiHoleApiService.getExactDomain(
              piHole,
              ApiList.whitelist,
              ruleDomain,
            )

        // A user changed or removed the entry while the timer was running.
        // In that case their newer state wins and we do not overwrite it.
        if (!current || !this.domainsEqual(current, target.expected)) {
          continue
        }

        if (target.original) {
          const payload = {
            comment: target.original.comment,
            groups: target.original.groups,
            enabled: target.original.enabled,
          }
          if (isRegex) {
            await PiHoleApiService.replaceRegexDomain(
              piHole,
              ApiList.whitelist,
              ruleDomain,
              payload,
            )
          } else {
            await PiHoleApiService.replaceExactDomain(
              piHole,
              ApiList.whitelist,
              ruleDomain,
              payload,
            )
          }
        } else if (isRegex) {
          await PiHoleApiService.deleteRegexDomain(
            piHole,
            ApiList.whitelist,
            ruleDomain,
          )
        } else {
          await PiHoleApiService.deleteExactDomain(
            piHole,
            ApiList.whitelist,
            ruleDomain,
          )
        }
"""
          if temp_text.count(old_restore) != 1:
              raise RuntimeError('Could not find temporary domain restore block')
          temp_text = temp_text.replace(old_restore, new_restore, 1)

          helper_marker = "  private static findPiHole("
          helpers = """  private static createGroupDomainActionKey(
    domain: string,
    groupName: string,
  ): string {
    return encodeURIComponent(`${domain}::${groupName}`)
  }

  private static createScopedDomainPattern(
    domain: string,
    groupName: string,
  ): string {
    const escapedDomain = domain.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&')
    const suffix = Array.from(`${domain}:${groupName}`)
      .map((character) => character.codePointAt(0)!.toString(16))
      .join('_')
    return `^${escapedDomain}$|^__pihole_browser_extension_domain_${suffix}__$`
  }

"""
          if temp_text.count(helper_marker) != 1:
              raise RuntimeError('Could not find temporary action helper marker')
          temp_text = temp_text.replace(helper_marker, helpers + helper_marker, 1)
          temp_path.write_text(temp_text, encoding='utf-8')

          # Update user-facing labels.
          locale_updates = {
              '_locales/en/messages.json': {
                  'popup_domain_general_actions': 'Permanent rule for all client groups',
                  'popup_second_card_whitelist': 'Whitelist permanently for all groups',
                  'popup_second_card_blacklist': 'Blacklist permanently for all groups',
                  'popup_temporary_whitelist': 'Temporary whitelist',
                  'popup_temporary_whitelist_group': 'Selected client group',
                  'options_temporary_allow_time_hint': 'Used by the three orange domain buttons for the selected client group. Minimum: 10 seconds',
              },
              '_locales/de/messages.json': {
                  'popup_domain_general_actions': 'Dauerhafte Regel für alle Client-Gruppen',
                  'popup_second_card_whitelist': 'Dauerhaft für alle Gruppen whitelisten',
                  'popup_second_card_blacklist': 'Dauerhaft für alle Gruppen blacklisten',
                  'popup_temporary_whitelist': 'Temporäres Whitelisting',
                  'popup_temporary_whitelist_group': 'Ausgewählte Client-Gruppe',
                  'options_temporary_allow_time_hint': 'Wird für die drei orangefarbenen Domain-Buttons der ausgewählten Client-Gruppe verwendet. Mindestens 10 Sekunden',
              },
          }
          for locale_path, updates in locale_updates.items():
              path = Path(locale_path)
              data = json.loads(path.read_text(encoding='utf-8'))
              for key, message in updates.items():
                  data[key] = {'message': message}
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent='\t') + '\n',
                  encoding='utf-8',
              )

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format and validate
        run: |
          npm run prettier-format
          npm run eslint
          npm run prettier-check
          npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-rc6-domain-scope.yml \
            .github/apply-rc6-domain-scope-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Scope temporary domain whitelisting to the selected group'
          git push origin HEAD:feat/vue3-vuetify-migration
