name: Patch domain status API

on:
  push:
    branches:
      - feat/vue3-vuetify-migration
    paths:
      - .github/domain-status-api-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/vue3-vuetify-migration
      - name: Patch Pi-hole API service
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/service/PiHoleApiService.ts')
          text = path.read_text()

          import_anchor = "import { PiHoleGroup, PiHoleGroups } from '../api/models/PiHoleGroups'\n"
          search_import = "import { PiHoleSearchResponse } from '../api/models/PiHoleSearch'\n"
          if search_import not in text:
              text = text.replace(import_anchor, import_anchor + search_import)

          status_anchor = """  public static async getPiHoleVersion(
            piHole: PiHoleSettingsStorage,
          ): Promise<AxiosResponse<PiHoleVersionsV6>> {
          """
          status_method = """  public static async getPiHoleStatusFor(
            piHole: PiHoleSettingsStorage,
          ): Promise<PiHoleApiStatus> {
            this.assertValidPiHole(piHole)
            const response = await this.getAxiosInstance(
              piHole.pi_uri_base!,
              piHole.api_key,
            ).get<PiHoleApiStatus>('/dns/blocking')
            return response.data
          }

          """
          if status_method not in text:
              text = text.replace(status_anchor, status_method + status_anchor)

          search_anchor = """  public static async getGroups(
            piHole: PiHoleSettingsStorage,
          ): Promise<PiHoleGroup[]> {
          """
          search_method = """  public static async searchDomain(
            piHole: PiHoleSettingsStorage,
            domain: string,
          ): Promise<PiHoleSearchResponse> {
            this.assertValidPiHole(piHole)
            const response = await this.getAxiosInstance(
              piHole.pi_uri_base!,
              piHole.api_key,
            ).get<PiHoleSearchResponse>(
              `/search/${encodeURIComponent(domain)}?partial=false&N=100`,
            )
            return response.data
          }

          """
          if search_method not in text:
              text = text.replace(search_anchor, search_method + search_anchor)

          path.write_text(text)
      - name: Remove temporary workflow files
        run: rm -f .github/workflows/patch-domain-status-api.yml .github/domain-status-api-trigger
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Pi-hole domain status API methods'
          git push origin HEAD:feat/vue3-vuetify-migration
