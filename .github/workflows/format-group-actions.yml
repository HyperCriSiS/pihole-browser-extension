name: Format group actions

on:
  push:
    branches:
      - feat/vue3-vuetify-migration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feat/vue3-vuetify-migration

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            src/module/option/vue/settings/OptionDisableTimeComponent.vue \
            src/module/popup/vue/components/PopupListCardComponent.vue \
            src/service/GroupDomainService.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/module/option/vue/settings/OptionDisableTimeComponent.vue \
            src/module/popup/vue/components/PopupListCardComponent.vue \
            src/service/GroupDomainService.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format group action changes"
            git push origin HEAD:feat/vue3-vuetify-migration
          fi
